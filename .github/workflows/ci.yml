name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_ANON_KEY: test-anon-key
      SUPABASE_SERVICE_ROLE_KEY: test-service-role-key

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Alineado a Prisma 7 (engine >=22) y evita EBADENGINE en CI.
          node-version: '22'
          cache: npm

      - run: npm ci

      - run: npm run build

      - run: npm test

      - run: npm run test:e2e

  # Construye la imagen de producción (Fargate ARM64) y la arranca. No la sube a ningún registro.
  docker-image:
    runs-on: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build linux/arm64
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          load: true
          push: false
          tags: polaria-wms-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Prueba de humo (GET /, usuario no root, tamaño)
        run: bash scripts/docker-smoke.sh polaria-wms-api:ci
